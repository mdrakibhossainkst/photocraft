
name: Build PhotoCraft macOS App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Build PhotoCraft
        run: |
          MACOSX_DEPLOYMENT_TARGET=11.0 \
          cargo build --release --locked \
            -p photocraft \
            --target x86_64-apple-darwin

      - name: Create macOS App Bundle
        run: |
          APP="PhotoCraft.app"

          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"

          cp target/x86_64-apple-darwin/release/photocraft \
            "$APP/Contents/MacOS/PhotoCraft"

          chmod +x "$APP/Contents/MacOS/PhotoCraft"

          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>PhotoCraft</string>
            <key>CFBundleDisplayName</key>
            <string>PhotoCraft</string>
            <key>CFBundleIdentifier</key>
            <string>com.photocraft.desktop</string>
            <key>CFBundleExecutable</key>
            <string>PhotoCraft</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>CFBundleShortVersionString</key>
            <string>0.7.0</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
          </dict>
          </plist>
          PLIST

          plutil -lint "$APP/Contents/Info.plist"

      - name: Package App
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            PhotoCraft.app PhotoCraft-macOS-Intel.zip

      - name: Upload macOS App
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCraft-macOS-Intel
          path: PhotoCraft-macOS-Intel.zip
          if-no-files-found: error
          retention-days: 14
